<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#145c44" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0B3D2E"/>

  <!-- Grid overlay -->
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Gold decorative border -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#D4AF7A" stroke-width="1.5" opacity="0.6"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#D4AF7A" stroke-width="0.5" opacity="0.3"/>

  <!-- Corner accents -->
  <path d="M 24 60 L 24 24 L 60 24" fill="none" stroke="#D4AF7A" stroke-width="2"/>
  <path d="M 740 24 L 776 24 L 776 60" fill="none" stroke="#D4AF7A" stroke-width="2"/>
  <path d="M 776 540 L 776 576 L 740 576" fill="none" stroke="#D4AF7A" stroke-width="2"/>
  <path d="M 60 576 L 24 576 L 24 540" fill="none" stroke="#D4AF7A" stroke-width="2"/>

  <!-- House icon -->
  <g transform="translate(400, 220)" opacity="0.5">
    <path d="M-50,0 L0,-50 L50,0 L50,60 L-50,60 Z" fill="none" stroke="#D4AF7A" stroke-width="2"/>
    <rect x="-15" y="20" width="30" height="40" fill="none" stroke="#D4AF7A" stroke-width="1.5"/>
    <rect x="-40" y="10" width="20" height="20" fill="none" stroke="#D4AF7A" stroke-width="1.5"/>
    <rect x="20" y="10" width="20" height="20" fill="none" stroke="#D4AF7A" stroke-width="1.5"/>
  </g>

  <!-- Gold divider line -->
  <line x1="320" y1="310" x2="480" y2="310" stroke="#D4AF7A" stroke-width="1" opacity="0.8"/>

  <!-- Main text -->
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#D4AF7A" letter-spacing="3" font-weight="400">IMAGE COMING SOON</text>

  <!-- Subtitle -->
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#D4AF7A" letter-spacing="2" opacity="0.6">THUKKUGUDA VILLAS</text>

  <!-- Bottom gold divider -->
  <line x1="340" y1="415" x2="460" y2="415" stroke="#D4AF7A" stroke-width="0.5" opacity="0.5"/>
</svg>
